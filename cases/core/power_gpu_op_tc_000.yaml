case_id: power_gpu_op_tc_000
feature_name: AI Core / Tensor Core
case_name: Tensor Core GEMM power versus time duty cycle
title: Tensor Core GEMM power versus time duty cycle
category: core
platform:
  targets: [NVIDIA H100, NVIDIA B200]
  gpus: [0]
preconditions:
  - Tensor Core GEMM workload is built on the target H100/B200 server.
  - Matrix shapes and data types are recorded with the result.
workload:
  type: command
  executable: ./build/workloads/tensor_core_burn
  args:
    - --device
    - "0"
    - --dtype
    - bf16
    - --engine
    - cutlass_tile_burn
    - --m
    - "32"
    - --n
    - "16"
    - --k
    - "64"
    - --synthetic-m
    - "32"
    - --synthetic-n
    - "16"
    - --synthetic-k
    - "64"
    - --cutlass-tile-m
    - "16"
    - --cutlass-tile-n
    - "8"
    - --cutlass-tile-k
    - "16"
    - --duty-cycle
    - "{duty_cycle}"
    - --active-sm-fraction
    - "1.0"
    - --period-ms
    - "500"
    - --blocks-per-sm
    - "6"
    - --mma-iters-per-loop
    - "256"
    - --atomic-period
    - "8192"
    - --sparsity-mode
    - none
    - --warmup-sec
    - "30"
    - --steady-sec
    - "60"
parameters:
  warmup_sec: 30
  steady_sec: 60
  sweep:
    duty_cycle:
      - {label: "0pct", value: "0.0"}
      - {label: "10pct", value: "0.1"}
      - {label: "20pct", value: "0.2"}
      - {label: "30pct", value: "0.3"}
      - {label: "40pct", value: "0.4"}
      - {label: "50pct", value: "0.5"}
      - {label: "60pct", value: "0.6"}
      - {label: "70pct", value: "0.7"}
      - {label: "80pct", value: "0.8"}
      - {label: "90pct", value: "0.9"}
      - {label: "100pct", value: "1.0"}
    op: tensor_core_gemm
telemetry:
  sampler: mock_nvml
  interval_ms: 500
  metrics:
    - timestamp_s
    - gpu_index
    - power_watts
    - utilization_gpu_pct
    - sm_clock_mhz
clock_control:
  enabled: false
  mode: none
  sm_clock_mhz: null
  mem_clock_mhz: null
expected:
  summary: Sweep Tensor Core GEMM duty cycle from 0% to 100% in 10% steps.
  key_metrics:
    - avg_power_watts_by_duty_cycle
    - tensor_active_pct
    - synthetic_mnk_controls_mma_count
    - requested_synthetic_tile_ops
    - distributed_synthetic_ops_per_block
    - synthetic_mma_ops_per_loop
    - synthetic_mma_ops_cap_applied
    - memory_traffic_minimized
  pass_criteria:
    - Power increases with higher duty cycle unless capped by clocks or thermals.
    - All duty-cycle points produce complete telemetry.
notes:
  - cutlass_tile_burn is a CUTLASS/CuTe MMA atom synthetic burn.
  - M/N/K are synthetic operation-count parameters, not real GEMM matrix dimensions.
  - No real A/B global matrices are loaded.
  - No shared-memory A/B tiles are used.
  - For M=32, N=16, K=64 and atom tile 16x8x16, requested_synthetic_tile_ops should be 16.
  - If synthetic_mma_ops_cap_applied=true, increase --mma-iters-per-loop to allow more requested synthetic MMA atoms per active loop.
  - active_sm_fraction is fixed at 100%; spatial coverage is covered by power_gpu_op_tc_001.
  - Sparse and dense-zero modes are not part of this duty-cycle case.
  - Dry-run records command generation only.
