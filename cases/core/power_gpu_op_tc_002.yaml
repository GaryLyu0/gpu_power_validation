case_id: power_gpu_op_tc_002
feature_name: AI Core / Tensor Core
case_name: Tensor Core GEMM duty cycle under locked GPU clocks
title: Tensor Core GEMM duty cycle under locked GPU clocks
category: core
platform:
  targets: [NVIDIA H100, NVIDIA B200]
  gpus: [0]
preconditions:
  - Clock locking is permitted by lab policy on the target server.
  - Thermal headroom is sufficient for repeated Tensor Core sweeps.
workload:
  type: command
  executable: ./build/workloads/tensor_core_burn
  args:
    - --device
    - "0"
    - --dtype
    - bf16
    - --engine
    - cutlass_tile_burn
    - --m
    - "32"
    - --n
    - "16"
    - --k
    - "64"
    - --synthetic-m
    - "32"
    - --synthetic-n
    - "16"
    - --synthetic-k
    - "64"
    - --synthetic-mma-ops-per-loop
    - "256"
    - --cutlass-tile-m
    - "16"
    - --cutlass-tile-n
    - "8"
    - --cutlass-tile-k
    - "16"
    - --duty-cycle
    - "{duty_cycle}"
    - --active-sm-fraction
    - "1.0"
    - --period-ms
    - "500"
    - --blocks-per-sm
    - "6"
    - --mma-iters-per-loop
    - "256"
    - --atomic-period
    - "8192"
    - --sparsity-mode
    - none
    - --warmup-sec
    - "30"
    - --steady-sec
    - "60"
parameters:
  warmup_sec: 30
  steady_sec: 60
  sweep:
    duty_cycle:
      - {label: "0pct", value: "0.0"}
      - {label: "10pct", value: "0.1"}
      - {label: "20pct", value: "0.2"}
      - {label: "30pct", value: "0.3"}
      - {label: "40pct", value: "0.4"}
      - {label: "50pct", value: "0.5"}
      - {label: "60pct", value: "0.6"}
      - {label: "70pct", value: "0.7"}
      - {label: "80pct", value: "0.8"}
      - {label: "90pct", value: "0.9"}
      - {label: "100pct", value: "1.0"}
    op: tensor_core_gemm
telemetry:
  sampler: mock_nvml
  interval_ms: 500
  metrics:
    - timestamp_s
    - gpu_index
    - power_watts
    - utilization_gpu_pct
    - sm_clock_mhz
clock_control:
  enabled: true
  mode: sweep
  sm_clock_mhz: [auto_low, auto_mid, auto_high]
  mem_clock_mhz: null
expected:
  summary: Run Tensor Core duty-cycle sweeps under multiple locked SM clocks.
  key_metrics:
    - avg_power_watts_by_clock_and_duty
    - clock_limit_mhz
    - synthetic_mnk_controls_mma_count
    - requested_synthetic_tile_ops
    - distributed_synthetic_ops_per_block
    - synthetic_mma_ops_per_loop
    - synthetic_mma_ops_cap_applied
    - memory_traffic_minimized
  pass_criteria:
    - Each clock point completes all duty-cycle steps on the target server.
    - Clock lock state is recorded with telemetry.
notes:
  - This is the locked-clock version of power_gpu_op_tc_000.
  - It uses the same CUTLASS/CuTe MMA atom synthetic burn workload as power_gpu_op_tc_000.
  - Clock sweep is the only intended additional variable.
  - M/N/K are synthetic operation-count parameters, not real GEMM matrix dimensions.
  - For M=32, N=16, K=64 and atom tile 16x8x16, requested_synthetic_tile_ops should be 16.
  - Do not emulate clock behavior on laptops.
  - Dry-run prints planned clock changes; non-dry-run resolves auto clocks through nvidia-smi on the target server.
